<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search recipes, see nutrition info and plan your weekly meals."
    />
    <title>Recipe and Meal Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script type="module" src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__logo" href="index.html">Recipe and Meal Planner</a>
      <nav class="site-header__nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html" aria-current="page">Search</a></li>
          <li><a href="plan.html">Meal Plan</a></li>
          <li><a href="favorites.html">Favorites</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section class="search" aria-labelledby="search-heading">
        <h1 id="search-heading">What shall we cook?</h1>
        <form id="search-form" class="search__form">
          <label for="search-input">Search recipes or ingredients</label>
          <div class="search__row">
            <input
              type="search"
              id="search-input"
              name="query"
              placeholder="e.g. chicken, pasta"
              required
            />
            <button type="submit" class="btn btn--primary">Search</button>
          </div>
        </form>
      </section>

      <p
        id="status-message"
        class="status"
        role="status"
        aria-live="polite"
      ></p>
      <section
        id="results"
        class="results"
        aria-label="Recipe results"
      ></section>
    </main>

    <footer class="site-footer">
      <p>
        &copy; <span id="year"></span> Recipe and Meal Planner. Recipe data from
        Spoonacular and TheMealDB.
      </p>
    </footer>
  </body>
</html>
